# Pont de transfert temporaire : le runner GitHub (accès internet libre)
# rapatrie les résultats Higgsfield dans une branche de transport.
# Se déclenche sur les pushs de la PR et ne fait rien si bridge-payload.json est absent.
# À supprimer une fois le retraitement des photos terminé.
name: higgsfield-bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bridge
        run: |
          set -e
          if [ ! -f bridge-payload.json ]; then
            echo "Pas de bridge-payload.json — rien à faire."
            exit 0
          fi
          MODE=$(jq -r .mode bridge-payload.json)
          if [ "$MODE" = "download" ]; then
            mkdir -p hf-results
            jq -c '.items[]' bridge-payload.json | while read -r item; do
              NAME=$(echo "$item" | jq -r .name)
              URL=$(echo "$item" | jq -r .url)
              curl -fsSL --retry 3 -o "hf-results/$NAME" "$URL"
              echo "$NAME téléchargé ($(stat -c%s "hf-results/$NAME") octets)"
            done
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git checkout -B claude/hf-results-temp
            git add -f hf-results
            git commit -m "Transport temporaire : résultats Higgsfield"
            git push -f origin claude/hf-results-temp
          else
            echo "mode inconnu ou non supporté: $MODE" && exit 1
          fi
